<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091a25"><link rel="manifest" href="manifest.webmanifest"><title>Mit Fiskeri</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#18475a 0%,#07141e 45%,#07111b 100%);color:#f5fbff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.01em}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(104,227,232,.035),transparent 45%);z-index:-1}header{max-width:1100px;margin:auto;padding:35px 22px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{display:flex;align-items:center;gap:13px}header .brandicon{height:53px;width:53px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(140deg,#1c6171,#103342);box-shadow:inset 0 1px rgba(255,255,255,.2),0 12px 35px #0005;font-size:26px}header h1{font-size:23px;font-weight:850;letter-spacing:-.055em;margin:2px 0}header small{font-size:9px;letter-spacing:.22em;color:#86b8c7;font-weight:800}header .edition{border:1px solid #3d6b76;background:#153744;color:#b3e9e9;border-radius:99px;padding:8px 11px;font-size:11px;font-weight:700}small,.muted{color:#99b2c0}h1,h2,h3{letter-spacing:-.04em}h2{font-size:20px;margin:0 0 15px}main{padding:14px 18px 115px;max-width:850px;margin:auto}.card{background:linear-gradient(155deg,rgba(29,61,77,.96),rgba(14,37,52,.97));border:1px solid rgba(142,199,214,.13);border-radius:24px;padding:22px;margin:0 0 15px;box-shadow:0 12px 35px #0002}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:linear-gradient(145deg,#1c4353,#123140);padding:21px 5px;text-align:center;border:1px solid #315666;border-radius:19px}.stat strong{font-size:27px;letter-spacing:-.06em;display:block}.stat small{font-size:11px;color:#a2bfcb}.stat:nth-child(1) strong{color:#78e3e2}.stat:nth-child(3) strong{color:#d7f9fa}button{border:0;border-radius:15px;padding:14px 18px;background:linear-gradient(115deg,#64dfdd,#28a9b7);color:#06232e;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 7px 22px #0a758533;transition:transform .15s,filter .15s}button:active{transform:scale(.97)}button:hover{filter:brightness(1.08)}button.secondary{background:#284857;color:#e5f6f8;box-shadow:none}button.danger{background:#a94257;color:white}button:disabled{opacity:.45}input,select,textarea{width:100%;background:#0b2533;border:1px solid #3a6271;color:white;border-radius:14px;padding:14px;font:inherit;margin:7px 0 15px;outline:none}input:focus,select:focus,textarea:focus{border-color:#6ee1e5;box-shadow:0 0 0 3px #6ee1e520}label{display:block;font-size:12px;color:#c1d6df;font-weight:650}.tabs{display:flex;overflow-x:auto;gap:7px;padding:9px 18px 13px;background:#091c28e8;backdrop-filter:blur(22px);position:sticky;top:0;z-index:3;max-width:900px;margin:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1;min-width:90px;padding:13px 9px;font-size:12px;background:#183340;color:#9fbac5;border:1px solid #294653;box-shadow:none;border-radius:14px;white-space:nowrap}.tabs button.active{background:#66dbdf;color:#06242d;border-color:#66dbdf;box-shadow:0 6px 25px #38b4bd30}.hidden{display:none}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{display:inline-block;padding:7px 11px;border-radius:20px;background:#24505b;color:#9af2e9;font-size:12px;font-weight:750}.photo{max-width:100%;max-height:260px;border-radius:12px;margin-top:8px}a{color:#80e5ed}.error{color:#ffb1a8}.good{color:#83e0ba}.mini{font-size:12px;color:#a8c3cd;line-height:1.6}.weatherday{border-bottom:1px solid #31505d;padding:12px 0}.hero{position:relative;overflow:hidden;border-radius:28px;padding:28px 23px;min-height:230px;margin:0 0 16px;background:radial-gradient(circle at 84% 20%,#2c79817a,transparent 40%),linear-gradient(140deg,#214b59,#0d293b 65%,#091d2b);border:1px solid #376071;box-shadow:0 18px 50px #0004}.hero:before{content:"";position:absolute;right:-48px;top:-58px;width:270px;height:270px;border:1px solid #7bcfd039;border-radius:50%;box-shadow:0 0 0 42px #66ced00b,0 0 0 85px #66ced008}.hero .eyebrow{color:#90c9d0;font-size:10px;font-weight:800;letter-spacing:.2em}.hero h2{font-size:36px;line-height:1.04;max-width:370px;margin:14px 0 10px}.hero p{max-width:370px;color:#bdd1d9;line-height:1.5}.hero button{margin-top:9px;position:relative}.hero .fishmark{position:absolute;right:18px;bottom:0;font-size:108px;opacity:.13;transform:rotate(-18deg)}.clockface{background:radial-gradient(circle at 50% 0%,#245e68,#102d3b 70%);border:1px solid #3a6772;border-radius:22px;padding:30px 12px;text-align:center;margin:16px 0}.clockface .digits{font-size:clamp(38px,8vw,68px);font-variant-numeric:tabular-nums;letter-spacing:-.06em;font-weight:800;line-height:1.3}.clockface .eyebrow{font-size:11px;letter-spacing:.16em;color:#a3c9d2;font-weight:800}.timebox{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0f2a38;border:1px solid #2d5160;border-radius:15px;padding:15px;margin:8px 0}.timebox strong{font-variant-numeric:tabular-nums;font-size:18px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1}.section-label{color:#8bb4c2;font-size:11px;letter-spacing:.13em;font-weight:800;margin:20px 2px 12px}.trip-item{padding:14px 0;border-bottom:1px solid #33525f;line-height:1.7}.trip-item:last-child{border-bottom:0}.delete-trip{padding:9px 12px;font-size:12px;background:transparent;color:#ffb5bd;border:1px solid #80505b;box-shadow:none}.delete-trip:hover{background:#63313c}.cancel-trip{background:transparent!important;color:#ffbac3!important;border:1px solid #80505b!important;box-shadow:none!important}@media(max-width:420px){header{padding:23px 16px 14px}header h1{font-size:20px}.tabs{padding-left:12px;padding-right:12px}.tabs button{min-width:81px}main{padding:12px 13px 100px}.card{padding:18px}.hero h2{font-size:31px}.hero{min-height:215px;padding:24px 20px}.stat strong{font-size:23px}.stat small{font-size:10px}}</style></head><body><header><div class="brand"><div class="brandicon">🎣</div><div><small>DIN PERSONLIGE FISKEAPP</small><h1>MIT FISKERI</h1></div></div><span class="edition">✦ PREMIUM 1.4</span></header><div class="tabs" id="tabs"></div><main><section id="home"></section><section id="trip" class="hidden"></section><section id="catch" class="hidden"></section><section id="places" class="hidden"></section><section id="weather" class="hidden"></section><section id="stats" class="hidden"></section></main><script>
const KEY='mitfiskeri-v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{trips:[],catches:[],places:[]};let active=db.active||null;let wx={};const $=id=>document.getElementById(id),save=()=>{db.active=active;localStorage.setItem(KEY,JSON.stringify(db))},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=t=>new Date(t).toLocaleString('da-DK'),duration=ms=>{let v=Math.max(0,Math.floor(ms/1000));return [Math.floor(v/3600),Math.floor(v/60)%60,v%60].map(n=>String(n).padStart(2,'0')).join(':')};const timeOnly=t=>new Date(t).toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit',second:'2-digit'});const sections=['home','trip','catch','places','weather','stats'],names=['Overblik','Fisketur','Fangst','Pladser','Fiskevejr','Statistik'];function go(s){sections.forEach(x=>$(x).classList.toggle('hidden',x!==s));$('tabs').innerHTML=sections.map((x,i)=>`<button class="${x===s?'active':''}" onclick="go('${x}')">${names[i]}</button>`).join('');if(s==='weather')renderWeather();if(s==='stats')renderStats();if(s==='places')renderPlaces();if(s==='catch')renderCatch();if(s==='trip')renderTrip();if(s==='home')renderHome()};function renderHome(){let mins=db.trips.reduce((s,t)=>s+(t.end-t.start),0)+(active?Date.now()-active.start:0);$('home').innerHTML=`<div class="hero"><div class="eyebrow">THE COAST IS CALLING</div><h2>${active?'Din fisketur er i gang.':'Eventyret starter ved vandet.'}</h2><p>${active?'Startet '+dt(active.start):'Gem øjeblikkene, følg dine fangster og find dine bedste fiskeforhold.'}</p><button onclick="go('trip')">${active?'◉ Se aktiv fisketur':'▶ Start en fisketur'}</button><span class="fishmark">🐟</span></div><div class="section-label">DIT OVERBLIK</div><div class="grid"><div class="stat"><strong>${db.catches.length}</strong><small>Fangster</small></div><div class="stat"><strong>${db.trips.length+(active?1:0)}</strong><small>Fisketure</small></div><div class="stat"><strong>${Math.max(0,...db.catches.map(c=>+c.length||0))} cm</strong><small>Personlig rekord</small></div></div><div class="section-label">HURTIGE HANDLINGER</div><div class="card"><div class="actions"><button onclick="go('catch')">＋ Ny fangst</button><button class="secondary" onclick="go('weather')">☁ Fiskevejr</button></div></div><div class="card"><h2>Seneste fangster</h2>${db.catches.slice().reverse().slice(0,5).map(c=>`<p>🐟 ${esc(c.species)} · <b>${esc(c.length||'?')} cm</b> · ${dt(c.time)} ${c.lat!=null?`· <a target="_blank" href="https://www.google.com/maps?q=${c.lat},${c.lon}">Kort ↗</a>`:''}</p>`).join('')||'<p class="muted">Din første fangst venter. Registrér den, næste gang du er ved vandet.</p>'}</div>`};function renderTrip(){$('trip').innerHTML=`<div class="section-label">FISKETUR · LIVE TRACKING</div><div class="card"><div class="row"><h2 style="margin:0">${active?'🟢 Aktiv fisketur':'Klar til næste tur'}</h2><span class="pill">${active?'● I GANG':'○ KLAR'}</span></div><div class="timebox"><span class="muted">◷ Starttidspunkt</span><strong>${active?timeOnly(active.start):'--:--:--'}</strong></div><div class="clockface"><div class="eyebrow">SAMLET FISKETID</div><div class="digits" id="clock">${active?duration(Date.now()-active.start):'00:00:00'}</div><div class="mini">${active?'Timeren tæller automatisk':'Timeren starter, når du begynder'}</div></div><div class="actions">${active?'<button class="danger" onclick="stopTrip()">■ Stop og gem</button><button class="secondary" onclick="go(\'catch\')">＋ Fangst</button><button class="cancel-trip" onclick="cancelTrip()">✕ Annuller tur</button>':'<button onclick="startTrip()">▶ Start fisketur</button>'}</div></div><div class="section-label">DIN HISTORIK</div><div class="card"><h2>Tidligere fisketure</h2>${db.trips.slice().reverse().map(t=>`<div class="trip-item"><div class="row"><b>${new Date(t.start).toLocaleDateString('da-DK')}</b><span class="pill">${duration(t.end-t.start)}</span></div><div class="mini">Start ${timeOnly(t.start)} · Slut ${timeOnly(t.end)} · ${db.catches.filter(c=>c.trip===t.id).length} fangster</div><div style="margin-top:10px;text-align:right"><button class="delete-trip" onclick="deleteTrip(${t.id})">🗑 Slet tur</button></div></div>`).join('')||'<p class="muted">Ingen afsluttede fisketure endnu.</p>'}</div>`};function startTrip(){active={id:Date.now(),start:Date.now()};save();renderTrip()}function stopTrip(){if(!active)return;db.trips.push({...active,end:Date.now()});active=null;save();renderTrip();renderHome()}setInterval(()=>{if(active&&$('clock'))$('clock').textContent=duration(Date.now()-active.start)},1000);
function cancelTrip(){if(!active)return;if(!confirm('Annuller denne aktive fisketur? Turen bliver ikke gemt. Eventuelle registrerede fangster bliver bevaret.'))return;active=null;save();renderTrip();renderHome()}
function deleteTrip(id){const t=db.trips.find(t=>String(t.id)===String(id));if(!t)return;if(!confirm('Slet denne fisketur permanent? Registrerede fangster bliver bevaret.'))return;db.trips=db.trips.filter(t=>String(t.id)!==String(id));save();renderTrip();renderHome()}
function renderCatch(){$('catch').innerHTML=`<div class="card"><h2>🐟 Registrer fangst</h2><form id="catchForm"><label>Art</label><select name="species"><option>Havørred</option><option>Regnbueørred</option><option>Hornfisk</option><option>Torsk</option><option>Andet</option></select><label>Længde (cm)</label><input name="length" type="number" step="0.1" min="0" placeholder="Fx 65"><label>Vægt (kg)</label><input name="weight" type="number" step="0.01" min="0" placeholder="Fx 3.0"><label>Blink / agn</label><input name="lure" placeholder="Fx Mørsilda bronze/rød 12 g"><label>Fangststed</label><input name="place" placeholder="Fx Brandsbøl"><label>Billede (kamera eller fotobibliotek)</label><input name="photo" type="file" accept="image/*" capture="environment"><label>Noter</label><textarea name="notes" placeholder="Hug, bundforhold, fisketeknik..."></textarea><p id="gpsstatus" class="mini">GPS hentes, når du gemmer fangsten.</p><button type="submit">Gem fangst med GPS og vejr</button></form></div>`;$('catchForm').onsubmit=saveCatch};function locate(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve(null);navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}),()=>resolve(null),{enableHighAccuracy:true,timeout:12000,maximumAge:0})})}async function fetchWeather(lat,lon){const w=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=ms&timezone=Europe%2FCopenhagen`;const m=`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,sea_surface_temperature,ocean_current_velocity,sea_level_height_msl&cell_selection=sea&timezone=Europe%2FCopenhagen`;let [a,b]=await Promise.allSettled([fetch(w).then(r=>{if(!r.ok)throw Error();return r.json()}),fetch(m).then(r=>{if(!r.ok)throw Error();return r.json()})]);return {land:a.status==='fulfilled'?a.value.current:null,marine:b.status==='fulfilled'?b.value.current:null}}async function saveCatch(e){e.preventDefault();const form=e.target,button=form.querySelector('button');button.disabled=true;button.textContent='Henter GPS og vejr…';let pos=await locate(),weather=null;if(pos){try{weather=await fetchWeather(pos.lat,pos.lon)}catch{}}let photo=null;const file=form.elements.photo.files[0];if(file){try{photo=await shrink(file)}catch{}}let c={id:Date.now(),time:Date.now(),trip:active?.id||null,species:form.elements.species.value,length:form.elements.length.value,weight:form.elements.weight.value,lure:form.elements.lure.value,place:form.elements.place.value,notes:form.elements.notes.value,lat:pos?.lat??null,lon:pos?.lon??null,accuracy:pos?.accuracy??null,weather,photo};db.catches.push(c);try{save()}catch{c.photo=null;save();alert('Billedet kunne ikke gemmes på denne enhed, men fangsten er gemt.')}alert(`Fangst gemt! ${pos?'GPS registreret.':'GPS var ikke tilgængelig.'} ${weather?.land?'Vejr gemt.':'Vejrdata mangler.'}`);go('home')}function shrink(file){return new Promise((resolve,reject)=>{let im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{let s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.65))};im.onerror=reject;im.src=u})}
function renderPlaces(){$('places').innerHTML=`<div class="card"><h2>📍 Favoritpladser</h2><p class="mini">Gem en fiskeplads med din aktuelle GPS-position.</p><label>Navn på fiskeplads</label><input id="placename" placeholder="Fx Sandvig"><button onclick="addPlace()">+ Gem sted med GPS</button></div>${db.places.map(p=>`<div class="card"><div class="row"><strong>${esc(p.name)}</strong><button class="secondary" onclick="showPlaceWeather(${p.id})">Se fiskevejr</button></div><p class="mini">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)} · <a target="_blank" href="https://www.google.com/maps?q=${p.lat},${p.lon}">Åbn kort</a></p><button class="secondary" onclick="removePlace(${p.id})">Fjern</button></div>`).join('')}`};async function addPlace(){let n=$('placename').value.trim();if(!n)return alert('Skriv stedets navn');let p=await locate();if(!p)return alert('GPS kunne ikke hentes. Giv browseren adgang til position.');db.places.push({id:Date.now(),name:n,lat:p.lat,lon:p.lon});save();renderPlaces()}function removePlace(id){if(confirm('Fjern fiskepladsen?')){db.places=db.places.filter(p=>p.id!==id);save();renderPlaces()}}function showPlaceWeather(id){go('weather');$('wxplace').value=String(id);loadForecast()}
function renderWeather(){$('weather').innerHTML=`<div class="card"><h2>🌤️ Fiskevejr</h2><p class="mini">Vælg en af dine GPS-gemte favoritpladser.</p><select id="wxplace">${db.places.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button onclick="loadForecast()" ${db.places.length?'':'disabled'}>Hent 5-døgns prognose</button><p class="mini">Fiskescoren er en eksperimentel vurdering, ikke en forudsigelse af fangst. Kystnære havmodeller kan være upræcise.</p></div><div id="wxresult">${db.places.length?'':'<div class="card">Gem først en favoritplads under Pladser.</div>'}</div>`};function score(wind,cloud,rain){let s=65;if(wind!=null)s-=Math.max(0,Math.abs(wind-5)-2)*5;if(cloud!=null)s+=Math.min(12,cloud/10);if(rain!=null)s-=Math.min(20,rain*8);return Math.max(0,Math.min(100,Math.round(s)))}async function loadForecast(){let p=db.places.find(p=>String(p.id)===$('wxplace').value);if(!p)return;$('wxresult').innerHTML='<div class="card">Henter prognose…</div>';try{let url=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,cloud_cover,precipitation&wind_speed_unit=ms&timezone=Europe%2FCopenhagen&forecast_days=5`;let marine=`https://marine-api.open-meteo.com/v1/marine?latitude=${p.lat}&longitude=${p.lon}&hourly=wave_height,sea_surface_temperature,sea_level_height_msl&timezone=Europe%2FCopenhagen&cell_selection=sea&forecast_days=5`;let [a,b]=await Promise.all([fetch(url).then(r=>r.json()),fetch(marine).then(r=>r.json()).catch(()=>null)]);if(!a.hourly)throw Error('Ingen vejrdata');let h=a.hourly,m=b?.hourly;let groups={};h.time.forEach((t,i)=>{let d=t.slice(0,10);(groups[d]??=[]).push(i)});$('wxresult').innerHTML=Object.entries(groups).map(([day,idx])=>{let hours=idx.filter(i=>+h.time[i].slice(11,13)>=5&&+h.time[i].slice(11,13)<=21);let best=hours.map(i=>({i,s:score(h.wind_speed_10m[i],h.cloud_cover[i],h.precipitation[i])})).sort((x,y)=>y.s-x.s)[0];if(!best)return '';let i=best.i,marineIndex=m?.time?.indexOf(h.time[i])??-1;let sea=marineIndex>=0?m.sea_surface_temperature?.[marineIndex]:null;let wave=marineIndex>=0?m.wave_height?.[marineIndex]:null;return `<div class="card"><div class="row"><strong>${new Date(day+'T12:00:00').toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'short'})}</strong><span class="pill">Fiskescore ${best.s}/100</span></div><p>Bedste time i modellen: <b>${h.time[i].slice(11,16)}</b></p><p>🌡 ${h.temperature_2m[i]??'–'} °C · 💨 ${h.wind_speed_10m[i]??'–'} m/s · ${h.wind_direction_10m[i]??'–'}°</p><p>☁️ ${h.cloud_cover[i]??'–'} % · 🌧 ${h.precipitation[i]??'–'} mm</p><p>🌊 Bølger ${wave??'–'} m · Havtemperatur ${sea??'–'} °C</p><p class="mini">Modelbaseret vurdering. Tjek lokale forhold før du går i vandet.</p></div>`}).join('')}catch(e){$('wxresult').innerHTML='<div class="card error">Kunne ikke hente vejrdata. Tjek forbindelsen, og prøv igen.</div>'}}function renderStats(){let all=db.trips.reduce((s,t)=>s+t.end-t.start,0),by={};db.catches.forEach(c=>{let k=c.lure||'Ikke angivet';by[k]=(by[k]||0)+1});$('stats').innerHTML=`<div class="card"><h2>📊 Din statistik</h2><p>Fangster: <b>${db.catches.length}</b></p><p>Afsluttede fisketure: <b>${db.trips.length}</b></p><p>Fisketid: <b>${duration(all)}</b></p><p>Fangster pr. 10 fisketimer: <b>${all?((db.catches.length/(all/3600000))*10).toFixed(1):'–'}</b></p><p>Største registrerede fisk: <b>${Math.max(0,...db.catches.map(c=>+c.length||0))} cm</b></p><h2>Fangster fordelt på agn</h2>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<p>${esc(k)}: ${v}</p>`).join('')||'<p class="muted">Ingen data endnu</p>'}</div><div class="card"><h2>Backup</h2><p class="mini">Version 1.2. Dine data gemmes kun lokalt i denne browser. Eksportér jævnligt en backup. Rydning af browserdata kan slette fiskedagbogen.</p><button onclick="backup()">Eksportér backup (JSON)</button><label style="margin-top:12px">Gendan backup</label><input type="file" accept="application/json" onchange="restore(event)"></div>`}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mit-fiskeri-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.trips)||!Array.isArray(data.catches)||!Array.isArray(data.places))throw Error();if(confirm('Erstat dine nuværende data med denne backup?')){db=data;active=data.active||null;save();go('home')}}catch{alert('Ugyldig backupfil')}}go('home');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
